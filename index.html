<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅費精算">
<title>MPI旅費交通費精算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 旅費交通費精算書 作成ツール（GitHub Pages 版）
   サーバーなし: データは各端末のブラウザ（localStorage）にだけ保存。領収書は端末内で文字認識し、決まった規則で読み取る。
   承認は印刷した精算書に紙で押印。Colour: MPI corporate blue (PANTONE 2995C ≈ #009CD1) as --brand. */
:root{
  --bg:#EEF3F6; --surface:#FFFFFF; --sunken:#F5F8FA; --ink:#17262E; --muted:#5A6B75; --line:#D2DDE3;
  --brand:#009CD1; --accent:#0074A6; --accent-soft:#DDEFF7; --accent-ink:#FFFFFF;
  --sat:#2D5DA6; --sun:#BD3A2E; --warn:#A8670F; --warn-soft:#FBF0DC; --ok:#2C7A4B; --ok-soft:#DFF1E6; --err:#B3261E; --err-soft:#FBE3E1;
  --f-display:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-num:"BIZ UDGothic","BIZ UDPGothic","Menlo",monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F171C; --surface:#162129; --sunken:#1C2932; --ink:#E2ECF1; --muted:#93A6B1; --line:#2A3A44;
  --brand:#2FB4E6; --accent:#45BCE8; --accent-soft:#15303D; --accent-ink:#04141B;
  --sat:#7EA6E8; --sun:#EE7D72; --warn:#E3A645; --warn-soft:#3A2D16; --ok:#6CC891; --ok-soft:#173326; --err:#F08A82; --err-soft:#3D1D1A; color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:0;z-index:10;background:var(--bg);border-top:4px solid var(--brand);border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{height:30px;width:auto;display:block;flex:none}
.brand-txt{display:flex;flex-direction:column;line-height:1.25;padding-left:12px;border-left:1px solid var(--line)}
.brand-txt .co{font-size:11px;color:var(--muted);letter-spacing:.08em}
.brand-txt h1{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0;letter-spacing:.04em}
.trial{font-size:10px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--muted);margin-left:6px;vertical-align:2px;font-weight:400;letter-spacing:0}
.foot{max-width:760px;margin:0 auto;padding:20px 16px 32px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
.foot img{height:16px;width:auto}

.notice{padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);font-size:14px}
.notice b{color:var(--warn)}
.notice.info{background:var(--accent-soft)}
.notice.info b{color:var(--accent)}
section{margin-top:20px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--f-display);font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
h2 .sub{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);font-size:14px}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.link{border:0;background:none;color:var(--accent);padding:0;min-height:0;font-size:13px;text-decoration:underline;font-weight:400}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{width:100%;min-height:56px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.claim{cursor:pointer;text-align:left;width:100%}
.claim:hover{border-color:var(--accent)}
.claim-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.claim-title{font-weight:700}
.claim-meta{font-size:12px;color:var(--muted)}
.amount{font-family:var(--f-num);font-weight:700;font-size:18px;white-space:nowrap}
.amount small{font-size:12px;font-weight:400;margin-left:2px}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f.wide{grid-column:1/-1}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--sunken);border-radius:8px;padding:9px 10px;font-size:16px;color:var(--ink);min-width:0;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.hint{font-size:12px;color:var(--muted)}
.err-text{font-size:13px;color:var(--err)}

.totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.totals div{background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.totals span{font-size:11px;color:var(--muted)}
.totals b{font-family:var(--f-num);font-size:15px}
.totals .grand{background:var(--accent-soft)}
.totals .grand b{color:var(--accent);font-size:17px}
@media (max-width:520px){.totals{grid-template-columns:repeat(2,minmax(0,1fr))}}

.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%;cursor:pointer}
.item:hover{border-color:var(--accent)}
.item.out{border-color:var(--err);background:var(--err-soft)}
.item-main{min-width:0;display:flex;flex-direction:column}
.item-main .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-main .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.dow-6{color:var(--sat)} .dow-0{color:var(--sun)}
.thumb{width:72px;height:96px;border-radius:6px;background:var(--sunken);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(10,20,18,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-m{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet-m{border-radius:16px;max-height:88%}}
.sheet-m h3{font-family:var(--f-display);margin:0;font-size:17px}
.photo-zone{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-zone img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.ocr{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.ocr.low{background:var(--warn-soft)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.viewer img{max-height:100%;max-width:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;font-size:14px;max-width:calc(100% - 32px)}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-inline:-16px;padding-inline:16px;display:flex;gap:8px;flex-wrap:wrap;z-index:5}
.sticky-actions .btn{flex:1}
.back{align-self:flex-start}

.blist{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.brow.warn{border-color:var(--warn);background:var(--warn-soft)}
.brow.off{opacity:.6}
.brow.dup{border-color:var(--err);background:var(--err-soft);opacity:1}
.bthumb img{width:72px;height:96px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.bbody{min-width:0;display:flex;flex-direction:column;gap:8px}
.bst{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.bon{display:flex;align-items:center;gap:4px;font-weight:700;color:var(--ink);cursor:pointer}
.bon input{width:18px;height:18px;accent-color:var(--accent)}
@media (max-width:520px){.brow{grid-template-columns:56px minmax(0,1fr)}.bthumb img,.bthumb .thumb{width:56px!important;height:76px!important}}
pre.ocrtext{white-space:pre-wrap;font-size:12px;margin:6px 0 0;padding:8px;background:var(--sunken);border-radius:6px}

/* PDF 用の用紙（紙なので固定の明るい色） */
#paper{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#111;font-family:var(--f-body)}
.pg{width:794px;height:1123px;padding:42px 46px;background:#fff;color:#111;display:flex;flex-direction:column;gap:10px;font-size:11px}
.pg h1{font-family:var(--f-display);text-align:center;font-size:22px;letter-spacing:.4em;margin:0 0 4px}
.pg-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid #009CD1;padding-bottom:6px}
.pg-head img{height:22px;width:auto}
.pg-head span{font-size:11px;letter-spacing:.1em;color:#333}
.pg table{border-collapse:collapse;width:100%}
.pg td,.pg th{border:1px solid #333;padding:2px 4px;height:20px}
.pg th{background:#E3F1F8;font-weight:700;font-size:10px;line-height:1.2;text-align:center}
.pg .lab{background:#E3F1F8;font-weight:700;text-align:center;width:72px;white-space:nowrap}
.pg .cnt{white-space:nowrap;font-size:10px;padding:2px 1px}
.pg .r{text-align:right;font-family:var(--f-num)}
.pg .c{text-align:center}
.pg tr.sat td{background:#E8EFFA} .pg tr.sun td{background:#FBE9E7}
.pg tr.tot td{font-weight:700;background:#F2F2F2}
.pg .sum th{font-size:10px}
.pg .sum td{font-size:13px;font-weight:700;text-align:right;font-family:var(--f-num)}
.pg .note{font-size:9px;max-width:150px;overflow:hidden;white-space:nowrap}
.pg .apv{display:flex;justify-content:flex-end;margin-top:auto}
.pg .apv table{width:auto}
.pg .apv td{width:96px;height:86px}
</style>
</head>

const pd = s => { if(!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const days = (a,b) => Math.round((pd(b)-pd(a))/86400000)+1;

function totals(items){
  const by = Object.fromEntries(CATS.map(c=>[c.k,0]));
  for(const it of items||[]) by[it.cat] = (by[it.cat]||0) + (+it.amount||0);
  const inv = by.pk_r + by.tr + by.ot_r, non = by.pk_n + by.ot_n, tax0 = by.nt;
  const dates = new Set((items||[]).filter(i=>+i.amount>0).map(i=>i.date));
  return {by, inv, non, tax0, total: inv+non+tax0, count: dates.size};
}
function periodError(c){
  if(!c.start || !c.end) return "開始日と終了日を入力してください。";
  if(c.end < c.start) return "終了日が開始日より前になっています。";
  if(days(c.start,c.end) > 31) return "対象期間は最大31日間です。";
  return "";
}
const inPeriod = (c,it) => it.date >= c.start && it.date <= c.end;

// 重複判定: 日付と金額が同じで、支払先も同じ（表記ゆれ・空白・全角半角は無視。どちらかが空なら日付と金額だけで判定）
// パーキングメーター・パーキングチケット（非課税の手数料）は同じ日・同じ金額で何度も払うことがあるので重複判定しない
const normPayee = s => (s||"").normalize("NFKC").replace(/[\s・,.、。()（）「」\-‐－]/g, "").toLowerCase();
const isMeter = v => v.cat==="nt" || /パーキング(メーター|メータ|チケット)|作動手数料|発給手数料/.test((v.payee||"").normalize("NFKC") + (v.note||""));
const sameReceipt = (a, b) => !isMeter(a) && !isMeter(b) && !!a.date && a.date===b.date && +a.amount>0 && Math.round(+a.amount)===Math.round(+b.amount)
  && (normPayee(a.payee)===normPayee(b.payee) || !normPayee(a.payee) || !normPayee(b.payee));
const findDup = (c, v, exceptId) => (c.items||[]).find(i => i.id!==exceptId && sameReceipt(i, v));
const dupLabel = i => `${md(i.date)}・${i.payee||"支払先未入力"}・${yen(i.amount)}円`;
// 3万円未満の電車・バスは公共交通機関特例の備考を入れる
const ocrNote = r => (r.cat==="tr" && r.amount && r.amount < 30000) ? `${r.payee||""} 公共交通機関特例適用`.trim() : (r.memo || "");

/* ---------- 端末内の文字認識（Tesseract.js） ---------- */
let tessP = null, tessLog = null;
function getTess(){
  if(!window.Tesseract) return Promise.reject({code:"文字認識の部品を読み込めませんでした（通信を確認してください）"});
  if(!tessP){
    tessP = Tesseract.createWorker("jpn", 1, { logger: m => tessLog && tessLog(m) })
      .then(async w => { await w.setParameters({preserve_interword_spaces:"1"}); return w; })
      .catch(e => { tessP = null; throw {code:"文字認識の準備に失敗しました", message:String(e?.message||e)}; });
  }
  return tessP;
}
// 写真の一部を長辺 target px に揃えて描き（小さい領収書は最大3倍まで拡大）、白黒にする。
// ① RGB の最大値を使う: 黒い文字は残り、緑の地紋（タイムズの透かし文字など）や色付きの枠は白に近づいて消える
// ② 周りの明るさに合わせて白黒を決める（Sauvola 法）: 影や照明のむら、感熱紙の薄い文字に強い
function prepCanvas(src, sx, sy, sw, sh, target){
  const s = Math.min(3, target / Math.max(sw, sh));
  const cv = document.createElement("canvas"); const W = cv.width = Math.max(1, Math.round(sw*s)); const H = cv.height = Math.max(1, Math.round(sh*s));
  const g = cv.getContext("2d", {willReadFrequently:true}); g.imageSmoothingQuality = "high";
  g.drawImage(src, sx, sy, sw, sh, 0, 0, W, H);
  const id = g.getImageData(0, 0, W, H), d = id.data, L = new Float64Array(W*H);
  for(let i=0;i<W*H;i++) L[i] = Math.max(d[i*4], d[i*4+1], d[i*4+2]);
  const W1 = W+1, I = new Float64Array(W1*(H+1)), I2 = new Float64Array(W1*(H+1));
  for(let y=0;y<H;y++){ let a = 0, a2 = 0; for(let x=0;x<W;x++){ const v = L[y*W+x]; a += v; a2 += v*v; I[(y+1)*W1+x+1] = I[y*W1+x+1] + a; I2[(y+1)*W1+x+1] = I2[y*W1+x+1] + a2; } }
  const r = Math.max(8, Math.round(Math.min(W, H)/24));
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const x0 = Math.max(0,x-r), y0 = Math.max(0,y-r), x1 = Math.min(W,x+r+1), y1 = Math.min(H,y+r+1), n = (x1-x0)*(y1-y0);
    const S = I[y1*W1+x1] - I[y0*W1+x1] - I[y1*W1+x0] + I[y0*W1+x0];
    const S2 = I2[y1*W1+x1] - I2[y0*W1+x1] - I2[y1*W1+x0] + I2[y0*W1+x0];
    const m = S/n, sd = Math.sqrt(Math.max(0, S2/n - m*m)), t = m*(1 + 0.2*(sd/128 - 1));
    const v = L[y*W+x] < t ? 0 : 255, p = (y*W+x)*4; d[p] = d[p+1] = d[p+2] = v;
  }
  g.putImageData(id, 0, 0);
  return cv;
}
// 写真の中から領収書（背景より明るい紙）の範囲を探す。見つからなければ []（写真全体を1枚として読む）
function findReceipts(bmp){
  const sc = 320 / Math.max(bmp.width, bmp.height);
  const w = Math.max(1, Math.round(bmp.width*sc)), h = Math.max(1, Math.round(bmp.height*sc)), N = w*h;
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const g = cv.getContext("2d", {willReadFrequently:true}); g.drawImage(bmp, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data, L = new Uint8Array(N), hist = new Float64Array(256);
  for(let i=0;i<N;i++){ L[i] = (d[i*4]*299 + d[i*4+1]*587 + d[i*4+2]*114)/1000; hist[L[i]]++; }
  let sum = 0; for(let v=0;v<256;v++) sum += v*hist[v];
  let sB = 0, wB = 0, best = -1, thr = 128;

  };
  rows.forEach(drawRow); prog();
  const list = q("#bList");
  list.addEventListener("input", e => {
    const row = rows.find(r => e.target.closest(`#br-${r.id}`)); if(!row) return;
    if(e.target.dataset.f) row.v[e.target.dataset.f] = e.target.value;
    if(e.target.matches("[data-on]")){ row.on = e.target.checked; drawRow(row); recheckAll(); }
  });
  list.addEventListener("change", e => {
    const row = rows.find(r => e.target.closest(`#br-${r.id}`)); if(!row || !e.target.dataset.f) return;
    if(["date","amount","payee"].includes(e.target.dataset.f)) recheckAll();
  });
  list.addEventListener("click", e => { const im = e.target.closest("[data-zoom]"); if(im) zoom(im.src); });

  (async () => {
    for(const r of rows.filter(x => x.primary)){
      if(stopped) return;
      r.st = "reading"; drawRow(r); prog();
      try{ r.thumb = await thumbOf(r.file); }catch{ r.st = "bad"; r.on = false; drawRow(r); prog(); continue; }
      drawRow(r);
      try{
        const parts = await deviceOcr(r.file, s => { const el = q(`#br-${r.id} .bst span:last-child`); if(el) el.textContent = s; });
        if(stopped) return;
        r.ocrText = parts.map((p, k) => (parts.length > 1 ? `【${k+1}枚目】\n` : "") + p.text + (p.extra.length ? `\n（読み直し: ${p.extra.join(" ／ ")}）` : "")).join("\n\n");
        const found = parts.map(parseReceipt);
        const fill = (row, o) => { row.v = {date:o.date, amount:o.amount, cat:o.cat, payee:o.payee, regNo:o.regNo, note:ocrNote(o)}; row.st = o.confidence==="high" && o.cat ? "ok" : "low"; };
        fill(r, found[0]);
        if(found.length > 1){
          r.part = `1/${found.length}`;
          let anchor = q(`#br-${r.id}`), at = rows.indexOf(r);
          found.slice(1).forEach((o, k) => {
            const nr = {id:uid(), primary:false, file:r.file, thumb:r.thumb, st:"ok", on:true, warn:"", dup:"", part:`${k+2}/${found.length}`, v:{}};
            fill(nr, o);
            rows.splice(++at, 0, nr);
            const el = document.createElement("div"); el.id = `br-${nr.id}`; anchor.after(el); anchor = el;
            check(nr); if(nr.warn || nr.dup) nr.on = false; drawRow(nr);
          });
        }
      }catch(e){
        if(stopped) return;
        r.st = "fail"; r.failMsg = e?.code || "";
      }
      check(r);
      if(r.warn || r.dup) r.on = false;
      drawRow(r); prog();
    }
  })();

  q("#bCancel").onclick = () => { stopped = true; m.remove(); };
  q("#bAdd").onclick = () => {
    recheckAll();
    const pick = rows.filter(r => r.on && !r.dup && r.st!=="bad");
    if(!pick.length){ q("#bErr").textContent = "追加できる明細がありません。"; return; }
    const bad = [];
    for(const r of pick){
      const v = r.v; v.regNo = (v.regNo||"").trim().toUpperCase();
      const miss = [!v.date&&"日付", !(+v.amount>0)&&"金額", !v.cat&&"区分"].filter(Boolean);
      if(miss.length) bad.push(`${v.payee||"支払先未入力"}：${miss.join("・")}が未入力`);
      else if(v.regNo && !/^T\d{13}$/.test(v.regNo)) bad.push(`${v.payee||"支払先未入力"}：登録番号は「T」と13桁の数字です`);
    }
    if(bad.length){ q("#bErr").innerHTML = bad.map(esc).join("<br>"); return; }
    // 写真は読み取りにだけ使い、保存しない（原本は紙で経理へ提出する運用）
    c.items = [...(c.items||[]), ...pick.map(r => ({id:uid(), date:r.v.date, amount:Math.round(+r.v.amount), cat:r.v.cat, payee:(r.v.payee||"").trim(), regNo:r.v.regNo, note:(r.v.note||"").trim()}))];
    touch(c); m.remove(); renderClaim(c); toast(`${pick.length}件の明細を追加しました`);
  };
}

/* ---------- 明細の追加・修正（手入力） ---------- */
function openItem(c, item){
  const isNew = !item;
  const it = item ? {...item} : {id:uid(), date:"", cat:"", amount:"", payee:"", regNo:"", note:""};
  const m = modal(`
    <h3>${isNew ? "明細を追加（手入力）" : "明細を修正"}</h3>
    <div class="grid">
      <label class="f">日付<input type="date" id="iDate" value="${it.date}"></label>
      <label class="f">金額（円）<input type="number" inputmode="numeric" min="0" step="1" id="iAmt" value="${it.amount}"></label>
      <label class="f wide">区分<select id="iCat"><option value="">選択してください</option>${CATS.map(x=>`<option value="${x.k}" ${x.k===it.cat?"selected":""}>${x.label}</option>`).join("")}</select></label>
      <label class="f wide">支払先<input id="iPayee" value="${esc(it.payee)}" placeholder="例：タイムズ○○駅前"></label>
      <label class="f">登録番号<input id="iReg" value="${esc(it.regNo)}" placeholder="T1234567890123"></label>
      <label class="f">備考<input id="iNote" value="${esc(it.note)}" placeholder="例：○○病院 訪問"></label>
    </div>
    <div class="hint" id="iHint"></div>
    <div class="err-text" id="iErr"></div>
    <div class="row end">
      ${isNew ? "" : `<button class="btn danger" id="iDel" style="margin-right:auto">この明細を削除</button>`}
      <button class="btn" id="iCancel">やめる</button>
      <button class="btn primary" id="iSave">${isNew ? "追加する" : "保存する"}</button>
    </div>`);
  const q = s => m.querySelector(s);
  const hint = () => {
    const cat = q("#iCat").value, amt = +q("#iAmt").value; let h = "";
    if(cat==="tr" && amt>0 && amt<30000) h = "3万円未満の電車・バスは公共交通機関特例の対象です。備考に支払先名と「公共交通機関特例適用」を書いてください。";
    if((cat==="pk_r"||cat==="ot_r") && !q("#iReg").value.trim()) h = "「登録番号あり」の区分です。領収書の登録番号（T＋13桁）を入力してください。";
    if(cat==="nt") h = "パーキングメーター作動手数料・パーキングチケット発給手数料などはこの区分です。";
    q("#iHint").textContent = h;
  };
  ["#iCat","#iAmt","#iReg"].forEach(s => q(s).addEventListener("input", hint)); hint();
  q("#iCancel").onclick = () => m.remove();
  if(q("#iDel")) q("#iDel").onclick = () => { c.items = c.items.filter(x => x.id !== it.id); touch(c); m.remove(); renderClaim(c); toast("明細を削除しました"); };
  q("#iSave").onclick = () => {
    const v = {date:q("#iDate").value, amount:Math.round(+q("#iAmt").value), cat:q("#iCat").value, payee:q("#iPayee").value.trim(), regNo:q("#iReg").value.trim().toUpperCase(), note:q("#iNote").value.trim()};
    const errs = []; if(!v.date) errs.push("日付"); if(!(v.amount>0)) errs.push("金額"); if(!v.cat) errs.push("区分");
    if(errs.length){ q("#iErr").textContent = `${errs.join("・")}を入力してください。`; return; }
    if(v.regNo && !/^T\d{13}$/.test(v.regNo)){ q("#iErr").textContent = "登録番号は「T」と13桁の数字です。"; return; }
    const ex = findDup(c, v, it.id);
    if(ex){ q("#iErr").textContent = `重複エラー：登録済みの明細（${dupLabel(ex)}）と同じ領収書のため登録できません。別の領収書の場合は、日付・金額・支払先が正しいか確認してください。`; return; }
    Object.assign(it, v);
    c.items = isNew ? [...(c.items||[]), it] : c.items.map(x => x.id===it.id ? it : x);
    touch(c); m.remove(); renderClaim(c); toast(isNew ? "明細を追加しました" : "明細を保存しました");
  };
}

/* ---------- PDF（精算書1枚。承認欄は空欄＝紙で押印） ---------- */
async function makePdf(c){
  const problems = [];
  if(!c.name.trim()) problems.push("氏名を入力してください。");
  if(!c.dept) problems.push("所属を選んでください。");
  const pe = periodError(c); if(pe) problems.push(pe);
  const out = (c.items||[]).filter(i => !inPeriod(c,i)).length; if(out) problems.push(`対象期間外の明細が ${out} 件あります。期間か日付を直してください。`);
  if(problems.length){ confirmBox("PDFを作成できません", problems.join("\n"), null); return; }
  if(!window.jspdf || !window.html2canvas){ toast("PDFの部品を読み込めませんでした。通信を確認して再読み込みしてください。"); return; }
  const btn = $("#pdf"); btn.disabled = true; btn.innerHTML = `<span class="spin"></span>作成中…`;
  try{
    const t = totals(c.items), byDate = {};
    for(const it of c.items||[]) (byDate[it.date] ||= []).push(it);
    const n = Math.min(days(c.start,c.end), 31), rows = [];
    for(let i=0;i<31;i++){
      if(i>=n){ rows.push(`<tr><td></td><td></td>${CATS.map(()=>"<td></td>").join("")}<td></td><td></td><td></td></tr>`); continue; }
      const d = pd(c.start); d.setDate(d.getDate()+i); const list = byDate[ymd(d)]||[];
      const sum = Object.fromEntries(CATS.map(x=>[x.k,0])); list.forEach(it => sum[it.cat] += +it.amount||0);
      const rowTotal = Object.values(sum).reduce((a,b)=>a+b,0);
      const note = list.map(it => it.note || it.payee).filter(Boolean).join("／");
      rows.push(`<tr class="${d.getDay()===6?"sat":d.getDay()===0?"sun":""}"><td class="c">${d.getMonth()+1}/${d.getDate()}</td><td class="c">${DOW[d.getDay()]}</td>${CATS.map(x=>`<td class="r">${sum[x.k]?yen(sum[x.k]):""}</td>`).join("")}<td class="r">${rowTotal?yen(rowTotal):""}</td><td class="c cnt">${list.length?list.length+"枚":""}</td><td class="note">${esc(note)}</td></tr>`);
    }
    const cnt = (c.items||[]).length;
    $("#paper").innerHTML = `<div class="pg">
      <div class="pg-head"><img src="${LOGO_LINE}" alt="MPI"><span>株式会社エム・ピー・アイ</span></div>
      <h1>旅費交通費精算書</h1>
      <table><tr><td class="lab">所属</td><td>${esc(c.dept)}</td><td class="lab">氏名</td><td>${esc(c.name)}</td><td class="lab">提出日</td><td>${jdate(c.submitDate)}</td></tr>
      <tr><td class="lab">開始日</td><td>${jdate(c.start)}</td><td class="lab">終了日</td><td>${jdate(c.end)}</td><td class="lab">対象期間</td><td>${n} 日間</td></tr></table>
      <table class="sum"><tr><th>インボイス計</th><th>非インボイス計</th><th>非課税</th><th>入力件数</th><th>領収書枚数</th><th>合計金額</th></tr>
      <tr><td>${yen(t.inv)}</td><td>${yen(t.non)}</td><td>${yen(t.tax0)}</td><td>${t.count}</td><td>${cnt}枚</td><td>${yen(t.total)}</td></tr></table>
      <table><thead><tr><th style="width:44px">日付</th><th style="width:28px">曜日</th>${CATS.map(x=>`<th style="width:66px">${esc(x.col).replace(/\n/g,"<br>")}</th>`).join("")}<th style="width:66px">行計</th><th style="width:42px">領収書<br>枚数</th><th>備考</th></tr></thead>
      <tbody>${rows.join("")}<tr class="tot"><td colspan="2" class="c">合　計</td>${CATS.map(x=>`<td class="r">${yen(t.by[x.k])}</td>`).join("")}<td class="r">${yen(t.total)}</td><td class="c cnt">${cnt}枚</td><td></td></tr></tbody></table>
      <div class="apv"><table><tr><th colspan="2">承　認</th></tr><tr><th>所属長</th><th>経　理</th></tr><tr><td></td><td></td></tr></table></div>
    </div>`;
    if(document.fonts?.ready) await document.fonts.ready;
    const el = $("#paper").firstElementChild;
    await Promise.all([...el.querySelectorAll("img")].map(im => im.decode().catch(()=>{})));
    const canvas = await html2canvas(el, {scale:2, backgroundColor:"#ffffff", logging:false});
    const pdf = new window.jspdf.jsPDF({unit:"mm", format:"a4", orientation:"portrait", compress:true});
    pdf.addImage(canvas.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, 210, 297);
    $("#paper").innerHTML = "";
    pdf.save(`旅費交通費精算書_${(c.name||"未記入").replace(/[\\/:*?"<>|\s]/g,"")}_${c.start.replaceAll("-","")}-${c.end.replaceAll("-","")}.pdf`);
    c.pdfAt = nowIso(); touch(c);
    toast("PDFを保存しました");
  }catch(e){
    toast("PDFの作成に失敗しました。もう一度お試しください。");
  }finally{
    btn.disabled = false; btn.textContent = "PDFを保存";
  }
}

load();
render();
</script>
